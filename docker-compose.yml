services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: reservation-salles-app
    restart: unless-stopped
    environment:
      APP_ENV: development
      APP_DEBUG: "true"
      DB_DRIVER: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: reservation_salles
      DB_USERNAME: reservation_user
      DB_PASSWORD: reservation_pass
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: reservation-salles-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: reservation_salles
      MYSQL_USER: reservation_user
      MYSQL_PASSWORD: reservation_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pass"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:5
    container_name: reservation-salles-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root_pass
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
 