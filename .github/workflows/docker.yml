name: Build and publish Docker image

on:
  push:
    tags:
      - '**'
  workflow_dispatch:
env:
  IMAGE_NAME: reservation-salles

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish tags
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            mapfile -t tags < <(git tag --list)
          else
            tags=("${GITHUB_REF_NAME}")
          fi

          if [[ ${#tags[@]} -eq 0 ]]; then
            echo "Aucun tag Git n'a ete trouve."
            exit 1
          fi

          docker build -t "${IMAGE}:${tags[0]}" .

          for tag in "${tags[@]}"; do
            docker tag "${IMAGE}:${tags[0]}" "${IMAGE}:${tag}"
            docker push "${IMAGE}:${tag}"
          done